    //     def baseName = "SolzIT-PRD"
        
    //     // Dynamically include version, variant name, or other info in the APK name
    //     def version = "1.0.4"
    //     def variantName = variant.name.capitalize() // Debug, Release, etc.
    //     def abi = output.getFilter(OutputFile.ABI) // e.g., armeabi-v7a, x86, etc.

    //     def name = "${baseName}-${version}-${variantName}${abi ? "-${abi}" : ""}.apk"
